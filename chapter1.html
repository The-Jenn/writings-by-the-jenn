        <h1>Chapter 1</h1>
        
        <p><Summary
Lisa Swain is a rule following police detective living a predictable, quiet suburban life
with her wife, Becky, and their teenage daughter. But her carefully structured world is
completely upended when Carla Connor, a stunning, unapologetic party girl and erotic
novel author, moves in next door. To get away from her busy dramatic city life. What
begins as a voyeuristic curiosity from Lisa&#39;s spare room window quickly spirals into a
consuming obsession. Drawn to Carla&#39;s chaotic energy and explicit world, Lisa finds
herself risking everything to cross the property line and the boundaries of her 13 year
marriage, plunging into a passionate, illicit affair with the woman next door.
Notes
Important note: This story has Becky in it but is not at all about Becky!!!

Chapter 1: Chapter 1 - The Suburbs

The neighborhood was quiet. People left at the same time in the morning and returned
at the same time at night. Lisa Swain liked it that way. She liked the predictability. After
a long day dealing with the chaos of the world, the silence of the suburbs was exactly
what she needed.
She walked through the front door, dropping her keys on the hall table. Becky was
already in the kitchen cooking.
&quot;You&#39;re late,&quot; Becky said, turning around with a wooden spoon in her hand. She smiled,
brushing a stray piece of hair out of her face.
&quot;Traffic,&quot; Lisa replied, walking over to kiss her wife on the cheek. &quot;Where&#39;s Betsy?&quot;
&quot;Upstairs. Swears she’s doing her algebra, but I can hear music and talking.&quot;
Lisa laughed softly. They had a good life. It was safe, steady, and built on 13 years of
solid partnership. Lisa was the glue that kept everything together, patient, organized,
and deeply practical, she also made the money. Together, they made sense. Raising a
teenager was never easy, but Betsy was a good kid, even if she did currently have a
terrible attitude.
Lisa grabbed a bottle of water from the fridge and looked out the window above the
sink. &quot;Looks like someone finally bought the King place.&quot;
Becky turned to look. Next door, a massive moving truck was backed into the driveway.
Three guys were struggling to carry a large, very expensive looking sofa up the front
steps.
&quot;Really? Have you seen who it is?&quot; Becky asked.
&quot;No,&quot; Lisa said, taking a sip of water. &quot;Just the movers. Looks like they’ve got a lot of
stuff.&quot;
&quot;Well, let&#39;s hope they don&#39;t have loud dogs,&quot; Becky said, turning back to the stove.&quot;
&quot;I&#39;m sure they&#39;ll be fine,&quot; Lisa said. &quot;I&#39;m going to go change out of these work clothes.&quot;
———
Four days passed. The moving trucks vanished, replaced a black sports car that looked
entirely out of place next to the neighborhood&#39;s standard lineup of minivans and sedans.

It was Saturday afternoon. Becky had taken Betsy to the mall to hunt for a dress for a
school dance, leaving the house completely empty. Lisa was supposed to be cleaning
out the garage, but she had gotten sidetracked organizing some old boxes in the
upstairs guest room.
The room was warm, baking in the mid afternoon sun. Lisa walked over to the window
to push it open and let in a breeze.
As she pushed the glass up, she glanced down into the neighbor&#39;s backyard. The
previous owners had installed an inground pool right before they decided to move. For
months, it had sat empty and covered. Now, the cover was off, the water was a
sparkling blue, and someone was using it.
Lisa stopped, her hands resting on the window sill.
A woman was lying flat on her back on a sun lounger right at the edge of the water. She
was wearing a white bikini. From the second story, Lisa had a perfectly clear view. The
woman was tanned. She wasn&#39;t just thin, she was built. Lisa could clearly see the
definition of muscle in her arms, a tight, strong core, and powerful legs. Dark hair spilled
over the top of the cushion.
Lisa just stared. She didn&#39;t mean to, but she found herself entirely unable to look away.
There was a careless confidence in the way the woman lay there. She reached blindly
for a glass on a small table beside her, took a sip, and set it back down without ever
opening her eyes. The simple movement highlighted the flex of her shoulder.
Lisa felt a sudden, strange tightness in her chest. It was pure intrigue, something she
hadn’t felt in a very long time. It felt entirely out of place in her quiet, predictable life.
She took a step back from the window, her heart beating faster than normal. She shook
her head, feeling ridiculous.
But a few seconds later, she stepped back to the glass, just to look one more time.
Down below, Carla Connor was doing her absolute best to ignore her phone. It was
vibrating against the concrete deck, buzzing with texts from people in the city she didn&#39;t
feel like dealing with today.
Moving to the suburbs was supposed to be a joke. Or an escape. She hadn&#39;t quite
decided yet.
She took another sip of her vodka tonic and let her head fall back against the towel. She
was single, thirty eight, and notoriously terrible at slowing down. Her friends thought she
had completely lost her mind buying a house out here among the families and the

perfect lawns. They had a running bet on how long she would last before she got bored
and moved back to her apartment in the city.
Carla closed her eyes, letting the sun bake into her skin. She loved the heat. She loved
the feeling of doing absolutely nothing, at least for an afternoon. Last night had been a
blur, a club opening, far too many drinks, and a guy whose name she forgot before she
even paid the cab driver to take him home. It was the same routine she always ran, just
starting from a different zip code.
She wasn&#39;t looking to settle down. She didn&#39;t want the quiet life. She just wanted a new
playground, a place where she didn&#39;t know everyone&#39;s business and they didn&#39;t know
hers.
She shifted on the lounger, adjusting the strings of her bikini top. She knew she stood
out here. She liked standing out. The moving guys had tripped over themselves trying to
carry her boxes inside, and she knew the neighborhood wives were probably already
gossiping about the single woman with the expensive car and the loud music.
Let them talk, she thought, a smirk playing on her lips.
She didn&#39;t know who lived in the houses next door. She hadn&#39;t bothered to look. All she
cared about right now was the sun, the alcohol in her glass, and the fact that she didn&#39;t
have to answer to anyone.
She reached down, grabbed her phone, and finally switched it off completely, tossing it
onto the grass. The suburbs were going to take some getting used to, but Carla never
backed down from a challenge. She stretched her legs out, admiring her own tan,
completely unaware of the eyes watching her from the window next door.

The rest of the weekend passed in a blur of domestic life. Lisa mowed the front lawn,
fixed a leaky faucet in the downstairs bathroom, and tried to forget the attractive woman
she saw out of the window.
By Tuesday evening, the heat had finally broken, leaving behind a warm, heavy breeze.
Lisa was in the backyard, wrestling with a stubborn patch of weeds near the property
line. A few yards away, Betsy was endlessly bouncing a tennis ball against the side of
the brick patio, the noise pounding in Lisa&#39;s head.
&quot;Betsy, take it easy on the brickwork,&quot; Lisa warned without looking up.
&quot;I&#39;m not hurting it,&quot; Betsy called back smiling.
And then, silence. Followed immediately by the rustle of leaves from the other side of
the six foot wooden fence.

&quot;Oops,&quot; Betsy muttered.
Lisa sighed, dropping her shovel and wiping her dirt-stained hands on her jeans. &quot;Go
inside and help your mother with the dishes. I&#39;ll get it.&quot;
Betsy didn&#39;t need to be told twice, immediately abandoning the patio and jogging back
into the house.
Lisa walked over to the fence. It was tall enough for privacy, but there was a small gap
near the oak tree where the wood had warped. She stepped on an exposed root to
boost herself up just enough to see over the top.
She expected to see the ball sitting in the grass. Instead, she found herself staring
directly at her new neighbor.
Carla Connor was sitting at a glass topped patio table. She wasn&#39;t in a bikini this time,
but she didn&#39;t look any less out of place. She wore a black silk robe tied loosely at her
waist, a pair of oversized sunglasses perched on top of her head, and she was holding
a half empty glass of red wine. In her other hand, she held Betsy&#39;s neon green tennis
ball.
Carla looked up. Her eyes locked onto Lisa’s face hovering just above the fence line.
Her expression was completely unreadable.
Lisa suddenly felt very conscious of the dirt on her cheek and the old, faded t-shirt she
was wearing.
&quot;Hi,&quot; Lisa managed, her voice sounding a little too loud in the quiet yard. &quot;I&#39;m sorry
about that. My daughter has a terrible backhand.&quot;
Carla didn&#39;t smile. She slowly turned the fuzzy green ball over in her hand, studying it
for a second before looking back up. &quot;You&#39;re the cop, right?&quot;
Lisa blinked, caught off guard. &quot;A detective, actually. Yes. Lisa Swain. I live next door.&quot;
She gestured awkwardly to the house behind her, realizing how stupid it looked since
she was literally hanging over the fence.
&quot;Carla,&quot; she replied, her voice slightly raspy and completely devoid of cheer. She didn&#39;t
bother to introduce herself further.
&quot;Welcome to the neighborhood,&quot; Lisa offered, leaning her forearms on the top of the
fence. She was trying for friendly, but the uninterested way Carla was looking at her
made her skin crawl. &quot;It&#39;s usually pretty quiet around here.&quot;
&quot;I noticed,&quot; Carla said flatly. She took a slow sip of her wine. &quot;Almost too quiet. Boring
even.&quot;

The comment directed at her, Lisa felt a sudden, irrational urge to defend her boring life.
&quot;We just like our peace. That&#39;s all.&quot;
Carla finally smiled, but it didn&#39;t reach her eyes. It was a knowing, dangerous kind of
smirk. She stood up, the silk robe slipping slightly off one shoulder. She walked over to
the fence, stopping just on the other side. Up close, Lisa could smell an expensive,
perfume cutting through the scent of the chlorine from the pool.
Carla tossed the tennis ball up lightly and caught it.
&quot;Tell your kid to work on her aim, Detective,&quot; Carla said smoothly. She reached up and
dropped the ball over the fence. It bounced harmlessly against Lisa&#39;s chest and fell into
the grass.
By the time Lisa looked back over the wood, Carla was already turning away, walking
back toward her house without another word.
Lisa dropped back down flat on her feet. She picked the tennis ball up off the grass,
gripping it tightly in her hand, and stared at the solid wooden planks.
——-
Later Lisa was in the kitchen cooking. She gave the pasta sauce one last stir and turned
the heat down to a simmer just as Becky walked into the room, dropping her bag on one
of the dining chairs with a heavy sigh.
&quot;Something smells amazing,&quot; Becky said. She walked over, wrapping her arms loosely
around Lisa’s waist from behind and resting her chin on Lisa’s shoulder.
&quot;Just penne and sausage,&quot; Lisa said, turning her head to press a quick kiss to Becky’s
cheek.
&quot;Where’s the teenager?&quot; Becky asked, she had been with some friends in the city
shopping.
&quot;Upstairs. I told her dinner would be ready in ten minutes.&quot;
They sat down together at the small wooden table a few minutes later. They talked the
usual stories, Becky’s friends being dramatic, the traffic on the bypass, a minor case
Lisa had wrapped up at the precinct. It was comfortable.
&quot;Oh, by the way,&quot; Lisa said, keeping her voice casual as she twirled a forkful of pasta. &quot;I
officially met the new neighbor today.&quot;
Becky paused, her fork halfway to her mouth. &quot;You did? What’s she like? Did she come
over?&quot;

&quot;No, Betsy hit her tennis ball over the fence. I had to go ask for it back.&quot; Lisa took a sip
of water, trying not to think about the way Carla had looked at her. &quot;Her name is Carla.&quot;
&quot;And?&quot; Becky pressed, clearly eager for some neighborhood gossip. &quot;Is she nice? She
seems like she has a lot of money, judging by that car in the driveway.&quot;
&quot;She’s... different,&quot; Lisa said carefully. &quot;A bit abrasive, honestly. I don&#39;t think she&#39;s used
to living in a place like this.&quot;
Becky laughed lightly, shaking her head. &quot;Well, she&#39;ll have to adjust. If she leaves her
trash bins out past Tuesday morning, Mrs. Gallacher down the street will have a field
day with her.&quot;
Lisa smiled, but before she could reply, a loud, heavy bass beat vibrated through the
kitchen walls.
Becky frowned, looking toward the front of the house. &quot;What is that?&quot;
A car horn honked on their quiet street.
Lisa pushed her chair back and walked over to the small window above the kitchen sink,
which looked out over their driveway and gave a partial view of Carla’s front yard. She
pulled the blinds back with two fingers.
A black limo was idling at the curb, hip-hop music spilling out of its open windows.
A second later, Carla’s front door swung open. Lisa felt her breath hold slightly.
Carla stepped out into the warm evening air. She was wearing a tight, dark dress that
ended high on her thighs and a pair of heels that looked hard to walk in. Her hair was
down and straight. She was laughing loudly, turning back to say something to two other
women who followed her out of the house.
&quot;Who is it?&quot; Becky asked from the table.
&quot;It&#39;s her,&quot; Lisa said softly, not letting go of the blinds.
She watched as Carla walked down the front walkway. One of her friends shouted
something, and Carla laughed, the sound carrying easily across the lawns. She pulled
the limo door open, sliding into the backseat while her friends piled in after her. The
door slammed shut, cutting off the music, and the limo sped off down the street.
Lisa stood at the window long after the taillights had disappeared around the corner.
It was a Tuesday night. The rest of the street was settling in for evening news and early
bedtimes. Lisa looked down at her own reflection in the dark glass of the window,

dressed in a faded t-shirt and sweatpants, her dinner getting cold on the table behind
her.
She let the blinds snap back into place. She wondered exactly where Carla Connor was
going, and why she couldn&#39;t stop thinking about it.

Wednesday morning started exactly the same way at 5:30 AM, the alarm on Lisa’s
phone buzzed quietly. She slipped out of bed, careful not to wake Becky, and went
downstairs to start the coffee.
The house was completely silent. This was usually Lisa&#39;s favorite time of day. It was the
only hour where she didn&#39;t have to be a detective, a mother, or a wife. She just had to
exist in the quiet kitchen.
She leaned against the counter, wrapping her hands around her warm mug, and stared
out the front window at the street. The sky was just starting to turn a pale blue.
Then, the sound of an engine broke the stillness.
An unfamiliar silver sedan pulled up to the curb next door. Lisa watched through the
window.
The back door opened, and Carla climbed out.
She was wearing the same dark dress from the night before, though it looked a little
rumpled now. Her heels were dangling from two fingers on her left hand, and she was
walking barefoot on the cool concrete of the driveway. Her hair was a tangled mess,
Lisa could see the smudged makeup around her eyes.
She looked exhausted. She looked like a disaster. And yet, she somehow still carried
herself like she owned the entire street.
The car drove off, leaving Carla standing alone in her driveway. She stopped for a
moment, dropping her head back and taking a deep breath of the morning air. She ran
her free hand through her hair, wincing slightly, then dug into a small clutch purse for
her keys.
She dropped them.
The keys hit the pavement. Carla let out a heavy sigh, saying a curse that Lisa could
just barely hear through the glass. She bent down to pick them up, moving with a
slowness that screamed of a massive hangover.

Lisa watched her struggle with the front door lock. It was a Wednesday. Normal people
were waking up for work, making school lunches, mentally preparing for staff meetings.
Carla was just getting home from a Tuesday night bender.
It was reckless. It was everything Lisa spent her career dealing with and her personal
life avoiding.
Carla finally pushed her door open. Before she walked inside, she paused and glanced
over her shoulder. She didn&#39;t look at the street; she looked directly at Lisa’s house. For
a split second, Lisa froze, wondering if Carla could see her standing in the dark kitchen.
But Carla just stared at the quiet, shook her head slightly, and disappeared inside.
Lisa let out a breath she didn&#39;t realize she was holding. She looked down at her coffee.
It had gone lukewarm. Upstairs, she heard the faint sound of the shower turning on,
Becky was awake. The routine was starting again.
For the first time in 13 years, the sound of the shower running upstairs didn&#39;t feel
comforting. It felt like a ticking clock. Lisa dumped the rest of her coffee down the sink,
her mind still replaying the image of Carla standing barefoot in the driveway.
Lisa left the house to head to the station. Another day of the same things.

The precinct was a zoo. It usually was by mid week, but today felt particularly crazy.
Lisa spent the first three hours of her shift untangling a messy domestic dispute at a
local diner, followed by endless paperwork and a tense briefing with her captain about a
string of burglaries on the east side of town.
She thrived in this environment. The noise, the adrenaline, the clear lines of right and
wrong it all made sense to her. Here, Detective Swain was respected, focused, and
entirely in control.
But today, her focus kept slipping.
Every time she stared at a witness statement or paused to take a sip of coffee, her mind
drifted back to the image of Carla. It was infuriating. She was a seasoned detective, she
didn&#39;t get fixated on strangers. Yet, she found herself analyzing Carla’s posture, the
smudge of her makeup, the careless way she held her shoes.
&quot;Swain, you with us?&quot;
Lisa snapped her head up. Her partner, Kit, was standing by her desk, holding out a file
folder.

&quot;Yeah, sorry. Just thinking about the case,&quot; Lisa lied smoothly, taking the folder.
&quot;Right. Well, captain wants this followed up before shift end.&quot; Kit looked at her closely.
&quot;You alright? You look a million miles away.&quot;
&quot;I&#39;m fine,&quot; Lisa said, perhaps a little too sharply. &quot;Just didn&#39;t sleep well.&quot;
She buried herself in work for the rest of the day, determined to push the new neighbor
out of her head. By the time 5:00 PM rolled around, she was exhausted, nursing a
headache, and more than ready for the predictable quiet of her own home.
The drive back to the suburbs was slow, the traffic heavy. When Lisa finally pulled into
her driveway, the evening sun was setting.
She grabbed her bag from the passenger seat and walked toward the front door, the
tension in her shoulders beginning to ease. She could hear the faint sound of the TV
from inside Betsy was probably watching her shows.
Then, she heard voices coming from the backyard.
Lisa paused, her hand on the front doorknob. She recognized Becky&#39;s voice
immediately bright, conversational, and high, the way she sounded when she was
talking to people.
The other voice was lower, slower, and laced with an unmistakable tone.
Lisa walked around the side of the house, her footsteps quiet on the grass, until she
reached the corner of the patio.
Becky was standing near the warped section of the fence, holding a pair of gardening
shears. On the other side, leaning casually against the wood with a cigarette trapped
between her fingers, was Carla.
Carla was wearing dark, oversized sunglasses that hid most of her face, a simple black
tank top, and faded jeans. She looked completely relaxed, taking a slow drag from her
cigarette and exhaling a thin stream of smoke into the air.
Becky was doing most of the talking. &quot;...and the neighborhood association is pretty strict
about the trash bins, but they&#39;re usually fine if you just bring them in by Wednesday
night. Oh, and the block party is soon! You should definitely come by, it&#39;s a great way to
meet everyone.&quot;
Carla looked bored. She wasn&#39;t being openly rude, but her body language screamed it.
She tapped the ash from her cigarette against the fence post, her gaze drifting lazily
over Becky&#39;s shoulder.

Then, Carla saw Lisa.
Even behind the dark lenses, Lisa could feel the shift in Carla&#39;s attention. The boredom
vanished, she became focused. A slow smile spread across Carla&#39;s lips.
&quot;Well,&quot; Carla said, her voice cutting smoothly through Becky&#39;s chatter. &quot;Looks like the
detective is home.&quot;
Becky saw Lisa &quot;hi! I didn&#39;t hear you, I was just welcoming Carla to the neighborhood.&quot;
Lisa walked forward, her muscles tight. She forced a polite smile for her wife, but her
eyes were fixed on the woman across the fence.
&quot;I see that,&quot; Lisa said, stopping beside Becky. She looked at Carla. &quot;Everything okay out
here?&quot;
&quot;Perfectly fine, Detective,&quot; Carla said, taking another drag. She looked Lisa up and
down, taking in her rumpled suit jacket and the tired lines around her eyes. &quot;Your wife
was just giving me the rundown on the local ordinances. Very informative.&quot;
There was a mocking edge to her tone that Becky completely missed.
&quot;She was just telling me she works in the city,&quot; Becky said, completely oblivious to the
sudden tension crackling between the two women. &quot;Must be a rough commute.&quot;
&quot;It has its moments, but I work from home too..I am a writer..&quot; Carla said, her eyes
never leaving Lisa&#39;s. She took one last drag of her cigarette, dropped it onto the
ground , and crushed it slowly under the heel of her boot.
&quot;Oh that&#39;s nice, a writer?&quot; Becky said. &quot;What do you write?&quot;
Carla looked at Becky and then at Lisa. &quot;Well nothing right now..I am having a bit of a
writers block. Normally I write adult erotic novels.&quot; Carla looking at Lisa as she said it.
Lisa took a deep breath. Becky chimed in &quot;Oh Wow, that is interesting, isnt it babe?&quot;
Lisa stood there, distracted then snapped back to reality. &quot; Uh yes, very.&quot;
Carla smirked. She knew they felt uncomfortable.
She pushed off the fence, standing to her full height.
&quot;Well, it&#39;s been a thrill,&quot; Carla said, her voice dripping with sarcasm. &quot;I must get back to
it.&quot;
She gave Lisa a mocking little salute with two fingers. &quot;See you around, neighbors.&quot;

Carla turned and walked back toward her house, her movements confident. Lisa and
Becky stood in silence, watching her go, until the back door of Carla&#39;s house slammed
shut.
&quot;Well,&quot; Becky said, her voice slipping a little. &quot;She&#39;s... interesting.&quot;
&quot;Yeah,&quot; Lisa said, her pulse speeding up. &quot;Interesting.&quot;

The house was finally asleep. Betsy had gone to bed at ten.
Lisa stood in the dark kitchen, a glass of tap water in her hand. She didn&#39;t really want a
drink. She just wanted an excuse to be awake. Without turning on the lights, she drifted
toward the window over the sink.
Next door, the underwater pool lights cast a glowing blue light across Carla’s patio.
Carla was outside. She was pacing the deck, her phone pressed against her ear. Even
through the double paned glass, Lisa could see was bothered by whatever she was
talking about on the phone.
She was arguing. Hard.
Lisa watched as Carla stopped pacing, pinching the bridge of her nose as she listened
to whatever the person on the other end of the line was saying. The party girl was
completely gone, leaving behind someone who looked exhausted, cornered, and very
frustrated.
For a second, Lisa felt an urge to go out there. To step over the fence and ask what was
wrong.
&quot;You&#39;re still awake,&quot; a soft voice murmured.
Lisa jumped, water splashing slightly over the rim of her glass.
Becky stepped up behind her in the dark. She smelled like lavender soap. Before Lisa
could step away from the window, Becky wrapped her arms around her waist, pressing
her chest against Lisa’s back.
&quot;Couldn&#39;t sleep,&quot; Lisa lied quietly, her eyes still fixed on the blue glow of the yard next
door.
&quot;Mmhmm,&quot; Becky hummed. She pressed a soft, lingering kiss to the side of Lisa&#39;s neck,
just below her ear. Her hands slid slowly up Lisa&#39;s stomach.

Lisa knew exactly what that touch meant. It was Friday night. It was their routine.
Outside, Carla abruptly pulled the phone away from her ear, stared at the screen for a
second, and threw it hard onto a padded patio chair. She slumped down onto the edge
of a lounger, burying her face in her hands.
Becky’s lips moved to Lisa’s shoulder, her breathing shifting, growing a little heavier.
&quot;Come to bed,&quot; she whispered against Lisa&#39;s skin.
Lisa felt a sudden, suffocating wave of guilt. She was standing in the dark, held by her
wife of 13 years, but her pulse was racing for the stranger having a breakdown on the
other side of the fence.
She closed her eyes, shutting out the sight of the pool and the woman sitting beside it.
&quot;Okay,&quot; Lisa said softly.
She set her water glass down on the counter, turned her back on the window, and let
Becky lead her up the stairs in the dark, giving in to a life she suddenly felt completely
disconnected from.

Chapter 2: Chapter 2 - Temptation

The annual cul de sac block party was exactly the kind of forced socialization Lisa
usually tried to endure with as much grace as possible. The street was barricaded off
with orange cones, and neighborhood kids were yelling as they ran through a sprinkler
set up on a lawn. Betsy was sitting on a porch steps a few houses down, with friends
looking suitably mortified by the entire event.
Lisa sat in a folding camping chair near the edge of her own driveway. She had her dark
aviator sunglasses on, shielding her eyes from the sun and hiding exactly where she
was looking.
She was already on her third beer.
Across the street, Becky was in her element. She was holding a plate of deviled eggs
and deep in conversation with Mrs. Gallacher.
Carla strolled out of her front door, and the entire energy of the block party shifted. She
wasn’t wearing anything overly scandalous, but somehow, she managed to turn heads.
She wore a short olivegreen dress that ended just above her knees. It looked incredibly
comfortable, made of a thin material that clung perfectly to her thighs and the curve of
her hips. Her hair was down, falling in loose, natural waves, and even from twenty feet
away, Lisa could catch the faint scent of that perfume cutting through the smell of
barbecue smoke.
Lisa gripped her cold beer can tighter, her jaw clenching.
It didn’t take long for the neighborhood to react. Within seconds, Greg from down the
street was offering her a fresh plate from the grill, and two other husbands were
suddenly very interested in the landscaping near where Carla was standing. They
tripped over their words, laughing too loudly at whatever she said.
The wives were divided. A few younger women nervously approached her, while most
of the older women whispered quietly.
Through it all, Lisa just watched. The dark lenses of her sunglasses were hiding her
eyes. She let her gaze travel down the smooth line of Carla&#39;s neck, lingering on the
delicate gold chain resting against her collarbone, before dropping to the slit in the side
of the dress.
Lisa took a long sip of her beer. She was starting to feel it loosen her body a bit.
After politely declining a hot dog and dodging a boring conversation about the
neighborhood, Carla finally removed herself from the crowd. She scanned the driveway,

her eyes landing on Lisa sitting alone in the shade. A slow smile touched her lips, and
she started walking over.
Out of the corner of her eye, Lisa saw Becky stop talking. Becky was watching them
from across the street.
&quot;Detective,&quot; Carla greeted, stopping right in front of Lisa&#39;s chair. She didn&#39;t sit. She just
stood there, letting the afternoon sun catch the glow of her tanned skin.
&quot;Carla,&quot; Lisa replied, keeping her voice carefully neutral. She didn&#39;t take her sunglasses
off. &quot;You decided to brave the local wildlife.&quot;
&quot;I figured I should make an appearance. Mingle with the locals.&quot; Carla glanced over her
shoulder at the group of husbands who were still watching her. &quot;They&#39;re very... eager.&quot;
&quot;They don&#39;t get out much,&quot; Lisa said dryly.
Carla laughed, a genuine sweet sound that made Lisa’s stomach tighten. Carla shifted
her weight, the fabric of her dress touching Lisa&#39;s knee. &quot;And what about you? Hiding
behind the sunglasses in the shade. Are you on duty, or just observing?&quot;
&quot;Observing,&quot; Lisa said. She took another sip of her beer, feeling unexpectedly bold.
&quot;You were putting on quite a show.&quot;
Carla looked down at her. She stepped a fraction of an inch closer, lowering her voice
so that it barely carried over the noise of the kids playing in the sprinkler.
&quot;I&#39;m just wearing a dress, Lisa. If people want to look, let them look.&quot; Carla paused,
tilting her head slightly. &quot;Though I have to admit, I prefer it when the audience is a little
more appreciative. Some people stare, but they don&#39;t really see anything.&quot;
Carla knew exactly what Lisa had been doing as soon as she walked out and it was
watching her .
Lisa should have shut the conversation down, stood up, and walked over to her wife.
But the beer had loosened the tight knot in her chest, and the smell of Carla&#39;s perfume
was scrambling her brain.
Instead of backing away, Lisa tilted her head back, looking directly up at Carla through
the dark lenses.
&quot;I see plenty,&quot; Lisa murmured, her voice dropping lower.
Carlas heart skipped, just slightly. It was a tiny break in her confident self, and it sent a
rush of pure adrenaline straight through Lisa’s veins. Carla’s eyes dropped briefly to
Lisa’s lips, a heavy, simmering heat.

&quot;Lisa?&quot;
The sharp voice broke the spell between them.
Lisa snapped her head up. Becky was walking across the asphalt toward them, an
empty plastic plate in her hand and a forced smile on her face. Her eyes darted
suspiciously between Lisa and Carla.
&quot;Everything okay over here?&quot; Becky asked, stopping next to Lisa&#39;s chair.
Carla didn&#39;t miss a beat. The heavy, erotic tension vanished in a second, replaced
immediately by the polite, slightly bored neighbor attitude.
&quot;Perfectly fine,&quot; Carla said smoothly, taking a step back. &quot;Lisa was just giving me some
tips on the best places to get takeout around here. I&#39;m still trying to find my way around.&quot;
&quot;Oh,&quot; Becky said, clearly thrown off by the boring topic. &quot;Well, there&#39;s a great Italian
place on Bleeker Street. We go there for anniversaries.&quot;
&quot;Sounds lovely,&quot; Carla said. She offered Becky a polite fake smile, then let her gaze
flick back to Lisa one last time. &quot;I should get going. I have a deadline to meet. Enjoy the
rest of your beer, Detective.&quot;
Lisa didn&#39;t say a word. She just watched Carla walk away, her hips swaying slightly as
she walked her way through the lawn chairs and back to her house.
&quot;She is so strange,&quot; Becky muttered, crossing her arms as she watched Carla
disappear inside. &quot;What were you two actually talking about?&quot;
&quot;Nothing,&quot; Lisa lied easily, lifting her beer to her lips to hide the smirk she couldn&#39;t quite
suppress.
——-
Three weeks had passed since the block party, and the heat of summer had settled
over the neighborhood.
For Lisa, those three weeks had been boring and mundane. She had kept her head
down, worked double shifts at the precinct, and played the part of the attentive wife. But
every time she heard a car door slam next door, the knot in her chest pulled a little
tighter.
Now, the house was empty.
Becky and Betsy had left on Monday for a week long school trip to Washington, D.C. in
the states. It was a huge trip Betsy had begged her moms to let her go on. I was

expensive but it was a good opportunity. Lisa had stayed behind to testify in a string of
court cases, but her schedule had finally cleared, leaving her with a four day weekend
and a quiet house.
It was past midnight on Thursday. Lisa was sitting in the dark on her back patio,
bourbon in her glass. It was her third bourbon. A soft, bluesy guitar track played quietly
from the portable speaker on the table beside her. She had her head thrown back
against the chair, her eyes closed, letting the alcohol dull her tense shoulders.
&quot;I was wondering how long it would take you to come outside.&quot;
Lisa opened her eyes slowly, smiling and hoping she would come over.
Carla was standing at the warped section of the fence. She was wrapped in an
oversized, heavy gray cardigan pulled tight over a simple black tank top and jeans and
barefoot. Her hair was messy, and she was holding a half empty glass of red wine.
&quot;Have you?&quot; Lisa said, her voice a little rougher than usual thanks to the bourbon. &quot;Just
keeping a low profile.&quot;
Carla rested her forearms on the top of the fence. &quot;I noticed the minivan has been gone
since Monday. The neighborhood feels practically deserted without your wife patrolling
the sidewalks.&quot; Carla said laughing at herself.
&quot;School trip,&quot; Lisa murmured. She took a slow sip of her drink. &quot;They&#39;re gone until
Sunday.&quot;
&quot;So, the detective is off the leash.&quot; Carla took a sip of her wine, her eyes studying Lisa.
&quot;No rules. No schedules. And you choose to spend it sitting in the dark, drinking alone.&quot;
Lisa let out a dry laugh. She pushed herself up from the chair and walked slowly over to
the fence, stopping just on her side of the wood. The bourbon made her limbs feel
heavy, but her mind was suddenly razor sharp.
&quot;The quiet is nice,&quot; Lisa admitted, leaning her shoulder against the fence post. They
were close enough now that Lisa could see the dark circles under Carla&#39;s eyes. She just
looked tired.
&quot;Is it?&quot; Carla asked softly. She looked down at her wine glass, tracing the rim with her
thumb. &quot;I hate the quiet. It’s too loud in my head. That’s the problem with what I do. You
spend all day making up fantasies, and then you look up and realize you&#39;re just sitting
alone in a giant, empty house in the suburbs.&quot;
Lisa frowned slightly, surprised by the sudden vulnerability. &quot;I thought you liked the
escape. You told Becky you moved here for a change of pace.&quot;

&quot;I told Becky what she wanted to hear,&quot; Carla said, a smile touching her lips. &quot;I moved
here because my publisher demanded a new manuscript in six months, and if I stayed
in the city, I would have drank myself into a hospital before I wrote a single chapter. I
needed isolation.&quot; She let out a long, slow breath. &quot;Turns out, I&#39;m terrible at being
isolated.&quot;
Lisa watched her, the music filling the silence between them. For the first time, Lisa
didn&#39;t see the reckless neighbor or the disruption to her life. She saw a woman under a
lot of amount of pressure, hiding it behind loud music and late nights.
&quot;I get it,&quot; Lisa said quietly.
Carla looked up, her eyes locking onto Lisa&#39;s. &quot;Do you?&quot;
&quot;I spend my entire day enforcing rules,&quot; Lisa said, staring down at the ice melting in her
bourbon. &quot;I put bad people away. I bring order to chaos. And then I come home, and I
have to be the perfect, stable wife. The reliable mother. I have to keep the yard looking
nice. It&#39;s a different kind of performance, but it&#39;s exhausting.&quot;
Lisa paused, the alcohol loosening a truth she hadn&#39;t even admitted to herself. &quot;And the
worst part is, I&#39;m sitting out here tonight, knowing my wife and daughter are thousands
of miles away... and I don&#39;t miss them. I just feel relieved.&quot;
The admission hung in the air, heavy and deeply shameful. Lisa braced herself for the
judgment, the sudden realization of how broken she sounded.
Instead, Carla reached across the top of the fence.
Her fingers gently brushed against the back of Lisa&#39;s hand where it gripped the glass.
The touch was light, but it sent a shockwave straight through Lisa&#39;s chest.
&quot;It&#39;s not a crime to want something for yourself, Lisa,&quot; Carla whispered, her voice
incredibly soft. &quot;You spend your whole life holding up the sky for everyone else. It
makes sense that you&#39;d want to drop it eventually.&quot;
Lisa stared at Carla&#39;s hand, then slowly looked up into her eyes. The physical attraction
had been there since day one, undeniable. But this emotional understanding, was much
more dangerous.
They stood there in the dark for a long time, the wooden fence the only thing keeping
Lisa&#39;s world from completely caving in.
Lisa slowly moved back, wrapping her fingers tightly around her glass. The sudden
absence of Carla&#39;s touch left her skin tingling. She cleared her throat, looking down at
the patio stones.

Carla didn&#39;t push. She let her hand drop back to her side, a small smile touching her lips
as she seamlessly shifted gears.
&quot;Since you&#39;re flying solo this week,&quot; Carla said, her tone suddenly lighter. &quot;Let me take
you to dinner tomorrow. Show me the area. I haven&#39;t ventured out past that depressing
local grocery store yet, and I could use a guide.&quot;
Lisa hesitated. Dinner. Just the two of them. It felt incredibly dangerous, but the word
slipped out before she could stop it.
&quot;I... yeah. Okay. Tomorrow.&quot;
&quot;Seven,&quot; Carla said softly. She tapped the wood of the fence, turned, and walked back
across her yard. Lisa stayed at her spot, watching until the glass door shut behind her.
Inside, Carla locked the door and walked straight through the dark, quiet house to her
office. She dropped her wine glass on the desk and sank into her leather chair. Her
laptop lit up.
She rested her chin in her hand, staring at the blinking cursor on the blank page, and
smiled.
What exactly was she doing? She didn’t flirt with married women. She didn&#39;t really flirt
with women at all. Sure, there had been a few drunken kisses at college parties, and
she wasn&#39;t immune to noticing when a woman was attractive. But as far as her actual
sex life went, she was straight. She had never been with a woman.
But Lisa Swain was different. There was something about the detective, the posture, the
way she wore her authority, the quiet desperation hiding just behind her eyes, that was
twisting something deep inside Carla&#39;s chest. It was a gravitational pull she had never
felt before, and the fact that Lisa was so repressed only made Carla want to push her
harder.
Carla pulled the keyboard closer. Her publisher had been breathing down her neck for
the new manuscript. They wanted a fresh angle. A new dynamic.
Carla knew exactly what she was going to write.
A lesbian romance. It was completely uncharted territory for her, both personally and
professionally. She might not have the physical experience yet, but her imagination was
already running wild, fueled entirely by the woman sitting on the patio next door.
She rested her fingers on the keys, her smile widening and began to type.

Detective Beth Casey liked her life in perfectly straight lines. Right and wrong. Black
and white. Guilty and innocent. She didn&#39;t have time for gray areas, and she certainly
didn&#39;t have time for the woman sitting across the interrogation table.
The suspect was everything Beth despised, confident and entirely too comfortable. She
had dark hair that tumbled over her shoulders, a killer smile, and eyes that looked at
Beth not like an officer of the law, but like a locked door she was dying to pick.
Beth crossed her arms, the fabric of her uniform shirt pulling tight across her chest. She
tried to ignore the sudden, suffocating heat filling the small room. She was the one
asking the questions. She was the one in control.
But as the woman leaned forward, the handcuffs clinking softly against the metal table,

Chapter 3: Chapter 3 - Dinner Date

Carla sat back and stared at the screen. A laugh escaped her. She was definitely done
for the night. This was going to require a lot more thought, and a lot more field research.
She threw back the last swallow of her wine and shut her laptop. Standing up, she
walked over to the side window of her office, the one that looked out over the fence line.
Lisa was still sitting exactly where she had left her. She was leaning back in the patio
chair, staring straight ahead into the dark yard, completely motionless.
&quot;That girl has some demons,&quot; Carla whispered to herself.
She reached up, her fingers lightly brushing her own lips where she had imagined the
detective’s mouth would be. Shaking her head, Carla turned off the office light and
headed to bed. For the first time since she’d moved to the suburbs, she was actually
looking forward to tomorrow.
The next evening, Lisa’s bedroom looked like a teenagers room with clothing.
She had changed three times. First, a button down shirt that felt too stiff, like she was
going into court. Then, a dark blouse that felt entirely too dressy for a casual dinner.
She stood in front of the full length mirror holding up a third option when she suddenly
stopped and let out a dry laugh.
What are you doing? she asked her reflection. Why are you stressing over this? It was
just dinner with a neighbor. A very attractive, intoxicating neighbor, sure, but still just
dinner. She tossed the clothes onto the bed and reached for something simple. She
pulled on a pair of dark denim jeans, a soft black V-neck t-shirt, and a white blazer over
it to dress it up just enough. She slipped her feet into a pair of black heels, ran a hand
through her blonde hair, and forced herself to exhale.
Right on cue, a knock echoed from downstairs.
Lisa froze for a second. She took a deep, breath, walked down the stairs, and opened
the front door.
Carla stood on the porch, and Lisa felt her face get hot for a second. She wore tight
black jeans tucked into black high-heeled boots, paired with a longer, slouchy black V-
neck sweater that hung off one shoulder, exposing her collarbone.
As Carla stepped slightly closer, the evening breeze caught her scent. Her usual
perfume. It was absolutely intoxicating.
&quot;Uh... hi. Please, come in,&quot; Lisa managed to say, stepping back to pull the door wider.

Carla walked inside. She stopped in the foyer and looked around. Lisa’s house was
immaculate, vacuumed rugs, perfectly aligned picture frames, not a single piece of
clutter in sight. It was Lisa’s need for order.
&quot;You have a lovely home,&quot; Carla said softly. She kept her hands buried in the pockets,
and Lisa noticed something she had never seen from Carla before, she looked almost
shy. The confident edge was gone, replaced by a quiet, nervous person.
&quot;Thank you,&quot; Lisa said, feeling a sudden, warm beat in her chest at the sight of Carla
out of her element. She grabbed her small leather purse from the entryway table. &quot;So,
where to?&quot;
Carla looked at her, and smiled. &quot;You&#39;re the guide, yeah? Where do you suggest?&quot;
&quot;Well, there&#39;s a bunch of random restaurants and bars over on Bleecker Street,&quot; Lisa
offered, stepping out onto the porch and locking the door behind them. &quot;It&#39;s got a little bit
of everything. We could head there and just see what stands out to you?&quot;
&quot;That sounds perfect,&quot; Carla said.
Lisa walked down the front steps, leading the way toward the street just as a set of
headlights swept around the corner. A yellow taxi pulled up.
&quot;I hope you don&#39;t mind,&quot; Lisa said, turning back to Carla as they reached the sidewalk. &quot;I
called a cab. I&#39;m not big on drinking and driving, being a cop and all.&quot;
Carla laughed. &quot;Makes perfect sense to me.&quot;
Lisa stepped forward and pulled the door of the cab open, holding it as Carla slid into
the backseat. The scent of her cologne lingered as she brushed past. Lisa took another
deep breath, climbed in right behind her, and pulled the door shut.
&quot;Bleecker Street, please,&quot; Lisa told the driver, as the cab pulled away from the suburbs
and headed toward the city.
The ride to Bleecker Street was quick. The awkwardness fell into a comfortable silence.
When the cab dropped them off. They found a small, bar. They sat corner.
&quot;Bourbon, neat,&quot; Lisa told the bartender when he approached.
&quot;Dirty martini. Extra olives,&quot; Carla said. Lisa looking at her smile as she talked to
bartender.
Once the drinks arrived, the silence broke and they looked across the table at each
other.

&quot;So,&quot; Lisa said. &quot;Did you go to college? Was writing always the plan? And ending up in
the suburbs?&quot;
Carla smiled, swirling the olive in her glass. &quot;I got a Literature degree, originally. I was
going to write a Great Novel. I spent four years in a tiny dorm room in the states reading
Hemingway and deciding I was entirely too cynical for the real world.&quot; She took a sip of
her drink. &quot;What about you? Let me guess. Class president. Straight A&#39;s. Probably
captain of the debate team.&quot;
Lisa let out a genuine laugh, the sound surprising even herself. &quot;Close. Softball captain.
Criminology major. I liked rules. I liked knowing that if someone crossed a line, there
was a consequence. The world felt very chaotic when I was growing up, so I think I just
gravitated toward structure.&quot;
&quot;Structure,&quot; Carla repeated softly, her eyes staring at Lisa&#39;s throat as she took another
drink. &quot;And does it still feel like that? Like you&#39;re holding it down?&quot;
&quot;Most days,&quot; Lisa admitted.
They finished their first round, the conversation countinuing easily. When they stepped
back out onto the street, the alcohol had giving Lisa a warm buzz over her nerves.
&quot;Hungry?&quot; Lisa asked.
&quot;Starved,&quot; Carla replied.
Lisa led them two blocks down to a sushi restaurant with bright paper lanterns. They
were seated at a small corner table, their knees touching because of the small area.
Over spicy tuna and yellowtail, the conversation shifted.
&quot;Tell me about the job,&quot; Carla said picking at her food with her chopsticks. &quot;The real job.
Not the paperwork.&quot;
Lisa paused. She rarely talked about work with Becky. Becky didn&#39;t like the ugly parts of
the world she preferred to pretend they didn&#39;t exist. But looking into Carla&#39;s intense
eyes, Lisa felt a sudden urge to be entirely honest.
&quot;It&#39;s heavy,&quot; Lisa said quietly, resting her forearms on the table. &quot;You see people on the
worst days of their lives. You see what people are capable of doing to each other
behind closed doors. Sometimes it’s domestic cases. Sometimes it’s... worse. You take
a piece of it home with you every night, no matter how hard you try to leave it at the
precinct.&quot;
Carla listened intently, her sushi forgotten. She didn&#39;t offer any story or tell Lisa how
brave she was. She just watched her, taking in Lisa&#39;s words.

&quot;That&#39;s why you sit in the dark on the patio,&quot; Carla murmured, almost to herself.
Lisa froze as she lifted her drink to her lips. Does she watch me too? Lisa thought.
&quot;Yeah,&quot; Lisa breathed. &quot;It&#39;s the only place it’s quiet enough to stop thinking.&quot;
Carla reached out, her fingertips just barely grazing the cuff of Lisa’s white blazer. It was
a gentle touch, meant to comfort, but it sent a chill straight up Lisa’s arm.
After they split the check, Lisa insisting, Carla fighting her for it finally giving Up with a
smile, they walked back out into the night.
”One more?&quot; Carla asked, looking up at Lisa. The lights reflected in her eyes, making
them look seductive. &quot;I&#39;m not ready to go back to the suburbs yet.&quot;
&quot;Me neither,&quot; Lisa said quietly staring Carla.
They found a dive bar a few streets over. They sat at the bar. They were sitting shoulder
to shoulder now.
They ordered another round, Lisa sticking to bourbon, Carla switching to a whiskey
ginger. The drinks were stronger here, and as the hour stretched past midnight, the
alcohol started to loosen Lisa’s restraint.
&quot;Okay, my turn,&quot; Lisa said, turning on her stool to face Carla. Their knees bumped, and
neither of them pulled away. &quot;You asked about my job. I want to know about yours. How
do you write it? Where do you even get the ideas?&quot;
Carla looked down at her glass, a sudden, unexpected flush in her cheeks. It was the
first time all night she looked genuinely guarded.
&quot;It&#39;s... complicated,&quot; Carla said, picking at the cardboard coaster.
&quot;You write about sex for a living,&quot; Lisa teased gently, leaning in closer. The scent of
Carla getting to her. &quot;It can&#39;t be that complicated.&quot;
&quot;The act isn&#39;t complicated,&quot; Carla corrected, looking up. &quot;The emotion is. Writing erotica
isn&#39;t just about putting A and B together. It’s about the vulnerability. It&#39;s about taking two
people, stripping away all their armor, and figuring out what happens when they entirely
surrender to each other.&quot; She traced the rim of her glass, choosing her words carefully.
&quot;It&#39;s incredibly personal. Sometimes it feels like taking off my own skin and putting it on
the page. That&#39;s why I don&#39;t like talking about it.&quot;
Lisa watched her, completely mesmerized. The party girl was a million miles away. This
woman was an artist, deep, highly observant, and protective of her world.

&quot;I understand,&quot; Lisa said softly. And she did. She understood the need to protect the
vulnerable parts of yourself from a world that didn&#39;t always get it.
Carla turned her head, her gaze locking onto Lisa&#39;s. The air between them suddenly felt
tense.
Carla wanted to say it. She wanted to lean across the bar and tell Lisa exactly what she
had been thinking since she saw her for the first time. She wanted to tell Lisa that her
heart had been acting a fool, that the closeness was driving her crazy.
But as Carla let her eyes drop to Lisa&#39;s hand resting on the bar, the light caught the gold
band on Lisa&#39;s left ring finger.
Tread lightly, Carla reminded herself. She had never been a home wrecker. She had
never crossed this particular line. Lisa was married. Lisa had a kid. Lisa had a whole life
that Carla had no business blowing up.
But God, she wanted to.
&quot;You&#39;re staring,&quot; Lisa murmured, a slight, tipsy slur.
&quot;I know,&quot; Carla whispered back, not looking away from Lisa&#39;s eyes. &quot;I&#39;m just trying to
figure you out, Detective.&quot;
&quot;Any luck?&quot;
&quot;Some,&quot; Carla said, a slow smile finally returning to her lips. &quot;But I think you&#39;re a mystery
that&#39;s going to take a lot to solve.&quot;
Lisa held her breath at that statement. She didn&#39;t pull back. She stared at Carla.
——-
The yellow cab pulled up to the quiet, dark curb of their suburban street. Lisa stepped
out first, her heels clicking softly on the pavement, and turned to hold the door open.
She offered a hand, and Carla took it, stepping out onto the sidewalk.
Lisa leaned back into the window to hand the driver a few bills, and the cab slowly
pulled away.
&quot;Thank you for tonight,&quot; Carla said softly, breaking the quiet. She wrapped her arms
around herself. &quot;I needed something like this.&quot;
Lisa turned to face her, her hands slipping into the pockets of her jeans. &quot;Like this?&quot;
&quot;Something real,&quot; Carla responded, her eyes searching Lisa&#39;s face. &quot;Something
stimulating and calm, but still fun.&quot;

Lisa let out a soft laugh, the bourbon still warming her blood. &quot;Not your usual all night
partying?&quot;
Carla tilted her head, a smile on her lips. &quot;How do you know I&#39;m out all night partying? &quot;
Lisa completely froze. Her heart skipped a beat, sudden panic cutting through the
alcohol buzz. She opened her mouth, scrambling for an excuse, terrified that she had
just exposed how often she stood in the dark spare room watching Carla’s driveway.
Carla watched the panic flash in the detective&#39;s eyes, and her smile softened into
something deeply amused. She felt like she knew exactly what Lisa was doing behind
those drawn blinds.
&quot;I&#39;m kidding, Lisa,&quot; Carla murmured, though the low tone of her voice suggested she
wasn&#39;t kidding at all.
They stood in silence for a long moment. The space between them felt incredibly small.
&quot;I would invite you in for a drink, but...&quot; Lisa stuttered, her gaze dropping to Carla&#39;s lips
before snapping back up to her eyes.
&quot;Oh, yeah, I totally get it. It&#39;s late,&quot; Carla said quickly, offering an easy out, even though
the thought of going inside Lisa’s empty, quiet house was making her head spin.
Lisa looked at her again, the conflict openly on her face. She took a half-step back
toward her own walkway. &quot;G&#39;night, Carla.&quot;
&quot;G&#39;night, Lisa,&quot; Carla whispered back, her voice barely carrying over the space between
them.
Carla turned and started walking toward her porch. With every step she took, she could
feel Lisa&#39;s eyes tracking her. It made her skin prickle. She smiled to herself, a thrill
racing down her spine as she walked the sidewalk and climbed the stairs to her front
door.
As she slid her key into the lock, she turned her head, looking back over her shoulder.
Lisa was still standing on the curb. She hadn&#39;t moved an inch, her white blazer glowing
faintly in the dark, just watching her.
Carla stopped. She met Lisa&#39;s gaze across the lawns, holding it for one charged,
breathless second. Then, she pushed the door open, stepped inside, and shut behind
her.
The moment the door shut, Carla let her head fall back against the door. She closed her
eyes, her heart beating a million miles a minute.

&quot;What the fuck are you doing, Carla?&quot; she whispered to the empty entryway.
She pushed off the door and walked straight down the hallway to her office. She didn&#39;t
bother turning on the overhead lights, just clicked on the small brass desk lamp and
flipped open her laptop. Her hands were actually trembling slightly as they hovered over
the keys. She needed an outlet for the feelings she was having.
She opened the document she had started the night before, read the last line, and
immediately began to type.

Lisa laughed. &quot;It&#39;s mostly paperwork, honestly. But yeah, I love it. It&#39;s about solving the

Lisa’s tensed up, but instead of pulling away, she did the exact opposite. She slowly,

lLisa tensed up. They were standing inches apart. Neither of them said the words.

pushing until she knew Lisa was done. She stopped and looked in her eyes.
“That was…” Carla started to say. “Fucking fantastic” Lisa finished saying. Carla smiled
at her. Leaning over her. She slowly pulled her fingers out and propped her self up on
elbows over Lisa. She reached down and kissed her slowly.
They made out for a bit then Carla slowly laid beside her.
Carla pulled the duvet up over them both. She curled her body around Lisa’s back,
wrapping one arm across Lisa&#39;s stomach, and pulled her against her chest.
Lisa reached down, resting her hand over Carla&#39;s. She didn&#39;t have the strength to say
thank you, but the way she squeezed Carla&#39;s fingers communicated everything she
needed to say.

It had been a while since Lisa got actual rest so she closed her eyes and finally just
slept.
——-
Lisa opened her eyes.
She looked at her watch. It was 8:14.
&quot;Shit,&quot; She sat up so fast her head spun. &quot;Shit, shit, shit.&quot;
She threw the blankets off and jumped out of bed. She grabbed her jeans off the floor
and put them on, her hands shaking so badly she could barely get the button closed.
She had fallen asleep. She had fallen so hard asleep in Carla’s arms that she hadn&#39;t set
an alarm, hadn&#39;t checked her phone, and hadn&#39;t woken up before the sun came up.
Carla sat up slowly, pulling the sheet up over her chest. She rubbed her face. &quot;Calm
down, Lisa. Just breathe.&quot;
&quot;Carla, it&#39;s after eight,&quot; Lisa panicked. She grabbed her shirt and pulled it over her head,
frantically searching the floor for her socks.
&quot;I should have been home hours ago. I was supposed to be back before anyone woke
up.&quot;
Carla just sat there and watched her scramble. She hated this. She hated seeing the
confident, capable woman she loved reduced to a terrified mess because of the psycho
living next door.
Carla couldn&#39;t wait for this drama to stop, but she knew she had to be the steady one
right now.
&quot;Stop panicking,&quot; Carla said firmly. &quot;If she&#39;s awake, just tell her you went for a walk. You
couldn&#39;t sleep, you needed air, so you went for a walk. It&#39;s fine.&quot;
Lisa threw on her boots. She looked at Carla sitting in the bed, looking so calm and
gorgeous. Lisa let out a breath, nodding quickly.
She stepped over to the edge of the mattress and leaned down.
&quot;I hope this will be over soon, I’ll text you later ok?&quot; Lisa whispered. Carla nodded.
She kissed Carla, turned around, and ran out of the bedroom.

She ran across the lawn and up her porch stairs. She unlocked the front door and
pushed it open.
The house was silent.
Lisa let out a quiet breath of relief.
She turned the corner and stopped. Becky was standing at the kitchen window.
She wasn&#39;t leaning against the counter. She wasn&#39;t using a crutch. She was standing
perfectly upright, her weight distributed evenly on both legs, staring out toward the
backyard.
Lisa’s looked at her in shock. She just stood there, staring at the woman who had spent
the last month claiming she couldn&#39;t walk to the bathroom without agonizing pain.
Becky turned her head. Her face was lacking the pathetic expression she usually wore.
It was twisted into pure anger.
Before Lisa could open her mouth, Becky reached out, grabbed a glass plate off the
drying rack, and threw it violently into the sink.
The plate shattered with a loud, sharp crash, pieces of ceramic flying across the
counter.
Lisa flinched, stepping back.
&quot;And where have you been all night?&quot; Becky demanded.
Becky turned away from the window to face Lisa. She looke evil, her eyes burning holes
straight through Lisa&#39;s face.
&quot;I... I went for a walk,&quot; Lisa said, her heart racing fast.
&quot;Right,&quot; Becky said.
Becky took a step toward Lisa. She added a slight limp to her stride, dragging her right
leg a little, but it was forced.
&quot;You&#39;re walking, Becky,&quot; Lisa said, her shock quickly morphing into anger.
Becky stopped. She leaned into the limp, exaggerating it now that she had been called
out.
&quot;Well, when your wife disappears for hours and leaves you completely abandoned in a
bed, you have to fend for yourself, don&#39;t you?&quot; Becky yelled. She took another step,

closing the distance between them. &quot;You&#39;re not a good wife, Lisa. You&#39;re actually
pathetic.&quot;
&quot;Don&#39;t call me pathetic,&quot; Lisa snapped. &quot;You just stood there perfectly fine until you
realized I was looking at you.&quot;
Becky reached out, grabbed a coffee mug off the counter, and threw it hard against the
wall by the kitchen table. It smashed into pieces, leaving a dent in the paint.
&quot;Shut up!&quot; Becky screamed. She walked right up to Lisa and shoved her hard in the
chest with her uninjured arm. &quot;A walk? Really? Do you think I&#39;m fucking dumb?&quot;
Lisa stumbled back a step from the shove, her hands coming up to defend herself.
&quot;Becky, stop it right now.&quot;
&quot;Mom!&quot;
The sound of Betsy&#39;s terrified voice came from the staircase.
Lisa looked up. Betsy was running down the stairs.
The second Becky heard Betsy’s voice, her entire demeanor shifted. She didn&#39;t look at
Betsy. She just looked at Lisa, let out a piercing scream, and threw herself backward
onto the kitchen floor.
Becky hit the ground and curled into a tight ball, sobbing hysterically.
&quot;Mom! What happened?!&quot; Betsy yelled, running into the kitchen and dropping to her
knees on the floor next to Becky.
Lisa immediately bent down, her police training taking over despite the absolute insanity
of the situation. She reached her hands out to check Becky&#39;s head.
&quot;Don&#39;t touch me, Lisa!&quot; Becky screamed at the top of her lungs, hitting Lisa’s hands
away.
&quot;Becky, calm down,&quot; Lisa said, keeping her voice as steady as she could over the
screaming.
&quot;Betsy, help me,&quot; Becky sobbed, grabbing the sleeve of Betsy’s shirt. She looked up at
her daughter, tears running down her face. &quot;Your mom decided to disappear all night
and left me her alone. I tried to get a glass of water and I fell.&quot;
Becky turned her head slightly. While Betsy was looking at her injured leg, Becky locked
eyes with Lisa.

Through the tears and the sobbing, Becky gave Lisa a cruel smile.
Lisa stared at her, frozen in shock.
&quot;What?!&quot; Lisa yelled back, the sheer audacity of the lie pushing her over the edge. &quot;She
was just standing at the window! She shoved me!&quot;
&quot;Stop fighting moms!&quot; Betsy yelled, her voice breaking into a sob. She covered her ears
with her hands, looking frantically between the two of them. &quot;I can&#39;t take it! Just stop!&quot;
Betsy reached down and grabbed Becky under the arms, trying to pull her up from the
floor. Betsy strained, but she was too weak to lift dead weight, and Becky was refusing
to help herself at all.
&quot;Move,&quot; Lisa said firmly.
Lisa stepped in, shoving Betsy gently out of the way. She bent down, grabbed Becky
under the arms, and picked her up.
Becky screamed and thrashed, but Lisa ignored it completely.
She half carried, half dragged Becky out of the kitchen and put her onto the living room
couch.
Lisa stood over her, breathing heavily, her fists clenched at her sides.
&quot;What the fuck, Becky?&quot; Lisa asked. &quot;What has gotten into you?&quot;
Becky stopped crying instantly. She looked up at Lisa, her eyes dry and filled with rage.
&quot;Why don&#39;t you tell me, Lisa?!&quot; Becky yelled back.
Betsy backed up against the front door. She was crying hard, her hands over her
mouth.
She didn&#39;t know what was happening. Her house had turned into a war zone again in a
matter of seconds, and the way her mothers were looking at each other terrified her.
&quot;Why don&#39;t you tell us, Lisa? Huh?&quot; Becky challenged, sitting up on the couch, “Tell us
where you were all night.&quot;
Lisa looked at Becky. She looked at the madness in her wife&#39;s eyes, the total willingness
to destroy everything in the room just to maintain control.
Then Lisa looked back at Betsy, who was shrinking against the door, completely
traumatized by the screaming.

Lisa couldn&#39;t do it. She couldn&#39;t stand in this living room and scream back. She couldn&#39;t
win this fight right now without breaking her daughter.
Lisa turned her back on Becky. She walked straight toward Betsy.
&quot;Mom, please,&quot; Betsy cried.
Lisa didn&#39;t stop. She reached past Betsy, grabbed the handle of the front door, and
pulled it open. She walked out, pulled the door shut behind her, and walked to her car.
She didn&#39;t look back at the house. She got into the driver&#39;s seat, started the engine, and
drove away, having absolutely no idea where she was going, only knowing she had to
get out of that house before she did something she couldn&#39;t take back.
Inside the living room, the silence was painful after the front door slammed shut.
Betsy stood frozen by the door, staring at
Her mom. &quot;Mom... what is happening?&quot; she asked, her voice shaking.
Becky sat on the couch, staring at the closed door. For a brief second, a little regret
crossed her face.
She hadn&#39;t wanted Lisa to leave. That wasn&#39;t part of the plan.
Becky looked over at Betsy. She let her shoulders slump, her face softening back into
the fragile, heartbroken mother.
&quot;Oh, Betsy,&quot; Becky sighed. &quot;I&#39;m sorry. I&#39;m so sorry you had to see that.&quot;
Betsy didn&#39;t move. She just wiped her eyes, looking at her mother with confusion.
&quot;There are some things going on between me and your mom at the moment,&quot; Becky
said quietly, looking down at her hands. &quot;She&#39;s just... she&#39;s not there for me anymore.
She&#39;s so angry all the time. I don&#39;t know how to fix it.&quot;
Becky looked up, her eyes wide and pleading. &quot;Please, can you help me back to bed? I
hurt so bad.&quot;
Betsy hesitated, but she walked over to the couch. She grabbed Becky by the arm and
braced her shoulder.
Becky made a huge show of struggling to stand. She leaned her entire weight on Betsy,
groaning loudly as they hobbled slowly down the hallway together.
They finally made it into the guest room. Betsy helped her down onto the mattress and
pulled the blanket up over her legs.

&quot;Thank you, sweetie,&quot; Becky whispered, closing her eyes.
Betsy didn&#39;t say you&#39;re welcome. She backed out of the room and closed the door. She
stood alone in the hallway, looking toward the kitchen where the broken plates were still
scattered across the floor. She knew something really bad was about to happen. She
just didn&#39;t know what to do.
Lisa drove. She didn&#39;t have a destination in mind. She just needed to put distance
between herself and the madness she had just walked away from.
Carla flashed into her mind. The warmth of her bedroom. The safety. Then the image of
Becky screaming on the kitchen floor violently replaced it. Then work. The precinct, the
paperwork, the normalcy she was desperately craving.
Lisa spotted an empty parking lot outside a closed strip mall and pulled the car in.
She threw the car into park, leaving the engine running, and grabbed her phone. She
found Carla’s name and called.
Carla picked up on the first ring. &quot;Lisa? Are you okay?&quot;
She knew Lisa had left her house not that long ago. For Lisa to be calling already meant
something had gone wrong.
Lisa leaned her forehead against the steering wheel, squeezing her eyes shut. &quot;I just
got into a massive fight with her. She was standing at the kitchen window when I walked
in, Carla. Perfectly fine. Just standing there. And when I caught her, she threw a plate
into the sink, started screaming at me, and then threw herself on the floor the second
Betsy came downstairs.&quot;
Carla let out a frustrated sigh.
&quot;She tried to tell Betsy I pushed her, or abandoned her, or I don&#39;t even know,&quot; Lisa
continued. &quot;I just left. I walked out the door and got in my car. Carla, it&#39;s time. I have to
start making the move to get out of this house. I need to talk to Betsy alone, explain
things, and then I am leaving Becky.&quot;
Carla just listened. She didn&#39;t interrupt, and she didn&#39;t try to calm Lisa down with empty
promises. Carla was ready. She was in love with this woman, and she wanted her out of
that trap badly. She just wasn’t sure Lisa would ever actually do it.
&quot;Can I do anything, Lisa?&quot; Carla asked.
&quot;You&#39;ve done enough, Carla,&quot; Lisa said. &quot;I&#39;m so sorry you got pulled into all of this. I...&quot;

&quot;Shhhh, hey,&quot; Carla interrupted quickly, cutting off the apology. &quot;Meeting you has been
the best thing in my life. I am not sorry I am in the middle of this. I only wish it were
under different circumstances.&quot;
Lisa let out small laugh, &quot;Yeah. Me too.&quot;
&quot;Are you safe right now? Where are you?&quot; Carla asked.
&quot;I&#39;m just sitting in a parking lot a few miles away,&quot; Lisa said. &quot;I got in my car and drove
off. I didn&#39;t know what to do after she made that scene in front of Betsy.&quot;
&quot;How about you go get a hotel room for the night,&quot; Carla suggested. &quot;Let her cool off.
You need a break, and going back right now is just going to start another screaming
match.&quot;
The suggestion was loaded, and they both knew it. A hotel room meant Carla could
come to her, and they could actually be together without Lisa rushing off.
Lisa smiled, the tension easing just a little.
&quot;I do need to go grab some stuff from the house first, though. Clothes. My toothbrush.&quot;
&quot;Lisa, going back there right now isn&#39;t a good idea,&quot; Carla warned. &quot;She&#39;s unstable. Just
go to a store, buy what you need for tonight.&quot;
&quot;I have to check on Betsy,&quot; Lisa insisted, her stubborn streak taking over. &quot;I can&#39;t just
leave her alone with Becky after that. I&#39;ll be quick. I&#39;ll just grab a bag and get out.&quot;
Carla sighed, knowing she couldn&#39;t win this argument. &quot;Okay. Keep your phone on. Call
me the second you leave.&quot;
Lisa hung up. She put the car in drive, turned out of the parking lot, and headed back
toward the house.
When Lisa walked through the front door, the house was quiet. She walked cautiously
toward the kitchen, half expecting Becky to be waiting for her, but the room was empty.
The shattered plate and the coffee mug was still scattered across the floor and the
counter.
Lisa walked to the utility closet, grabbed the broom and dustpan, and started cleaning
up the mess.
She swept the broken pieces into a pile, dumped them into the trash can, and wiped
down the counter.

Footsteps sounded on the staircase.
Lisa turned as Betsy walked into the kitchen. The teenager&#39;s face was pale, and her
eyes were red and swollen.
&quot;Mom...&quot; Betsy said, her voice cracking instantly. She started crying again, crossing the
kitchen quickly.
Lisa dropped the rag on the counter and caught her daughter, wrapping both arms
securely around her.
Betsy buried her face in Lisa’s shoulder, holding on tight.
Lisa hugged her back, resting her chin on Betsy’s head, tears falling.
&quot;Mom, please, will you tell me what&#39;s happening?&quot; Betsy cried against her shirt.
&quot;Oh, angel,&quot; Lisa whispered, smoothing down the back of Betsy’s hair. &quot;Your mother
and I just aren&#39;t seeing eye to eye at the moment. Things are just really tense right
now.&quot;
Lisa hugged her tighter, hating the vague answer but knowing she couldn&#39;t drop the
truth on a 16 year old while Becky was sleeping fifty feet away.
&quot;Listen,&quot; Lisa said, pulling back just enough to look Betsy in the eye. &quot;I&#39;ve got the
kitchen cleaned up. I am going to head to work for the night. I&#39;m taking an overnight
shift. They really need me on a case.&quot;
Lisa felt horrible lying to her face. She hated it. But she needed to get out of the house
for the night before Becky completely messed with Betsy’s head again, and a work
excuse was the only thing Becky couldn&#39;t argue with.
&quot;It&#39;s okay, Mom, I understand,&quot; Betsy said, wiping her nose with the back of her hand. &quot;I
can take care of her for the night.&quot;
Betsy stepped back, turning toward the stairs.
&quot;If anything happens, please call my cell, okay?&quot; Lisa called out, watching her go. &quot;I
don&#39;t care what time it is. I&#39;ll get home as fast as I can.&quot;
Betsy managed a small, tired smile. &quot;I will. Bye, Mom.&quot;
Lisa watched her walk upstairs. Once she heard Betsy’s bedroom door close, Lisa
moved quickly.
She walked past the guest room, and went straight upstairs to her bedroom.

The room felt horrible to her now. She walked into the closet, heading for the very back
where they kept the luggage and travel gear.
She looked up at the top shelf, spotting the black duffel bag she used for trips.
Lisa reached up and grabbed the handle, giving it a hard pull.
The bag was stuck. As it came loose, it dragged a cardboard box along with it.
The box had been hidden underneath the luggage.
The box tipped over the edge of the shelf, the lid falling off.
Stacks of loose paper came down, hitting Lisa on the shoulders and scattering all over
the closet floor.
&quot;Damn it,&quot; Lisa cursed, frustrated.
She threw the duffel bag onto the floor and bent down to pick up the mess.
She started gathering the papers into a pile. She planned to just shove them back into
the box, but as she grabbed a handful of pages, a logo caught her eye.
It was a bank logo. But it wasn&#39;t the bank they used for their joint checking or savings
accounts.
Lisa frowned. She looked closer at the top sheet. It was a formal bank statement,
addressed solely to Becky.
Lisa stood up slowly, holding the stack of papers. She walked out of the closet and
dumped the entire pile onto the center of the bed.
She started thumbing through the pages, spreading them out across the quilt.
&quot;What the...&quot; Lisa whispered.
She picked up a statement from two months ago. The balance at the bottom of the page
made lose her breath. It was a massive amount of money.
Lisa frantically grabbed more papers, organizing them by date, trying to understand
what she was looking at.
Lisa had always let Becky handle the finances. Lisa worked the long shifts, brought in
the paycheck, and Becky managed the bills, the savings, and the investments.

Becky was brilliant with numbers, she was organized , so Lisa had never questioned a
single decision. She simply trusted her wife.
But as Lisa read the statements, a horrifying picture began to form.
There were records of personal loans taken out in both of their names. There were
transfer receipts showing hundreds of dollars at a time moving from their joint account
into this hidden account.
The dates on the oldest statements went back 10 years.
10 years.
Becky had been siphoning money from Lisa&#39;s paycheck a bit at a time, for a decade.
She had built a hidden nest egg, taking out loans under Lisa’s name to cover the deficits
in their regular accounts, perfectly balancing the books so Lisa would never notice the
missing funds.
Lisa’s eyes went wide as the math finally clicked into place.
Becky wasn&#39;t just manipulating her emotionally. She wasn&#39;t just faking to keep Lisa
trapped.
She had been financially trapping her for their entire marriage. If Lisa ever tried to leave,
she would walk away completely broke and saddled with debt she didn&#39;t even know she
had, while Becky sat on a fortune.
&quot;What the fuck,&quot; Lisa said again.
Her hands were shaking. The betrayal was so thoroughly calculated, it made her feel
physically sick.
The woman downstairs wasn&#39;t just controlling, she was a predator.
Lisa moved with sudden purpose. She grabbed every piece of paper off the bed,
making sure she didn&#39;t leave a single receipt behind.
She shoved all of them into the duffel bag. She grabbed a pair of jeans, a clean shirt,
and her toiletries from the bathroom, throwing them on top of the financial records, and
zipped the bag shut.
She threw the strap over her shoulder and walked out of the bedroom.
She stopped at Betsy’s door, pushing it open slightly. Betsy was sitting on her bed, her
laptop open in front of her.

&quot;Hey,&quot; Lisa said. &quot;I&#39;m heading out.&quot;
Betsy looked up. &quot;Okay. What do I tell Mom when she wakes up?&quot;
&quot;Just let her know I&#39;m working,&quot; Lisa said, walking over and kissing the top of Betsy’s
head. &quot;I&#39;ll be back tomorrow. Call me if you need me.&quot;
&quot;I will,&quot; Betsy promised.
Lisa walked down the stairs and straight out the front door. She got into her car, threw
the duffel bag onto the passenger seat, and started the car.
She picked up her phone and typed a quick text to Carla.
I got my stuff. Going to the Marriott. Meet me there.
