<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writings By The Jenn - Home</title>
    <style>
        body {
            background-color: #4b5320; /* Army green fallback */
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            
            /* Text protection settings matching chapters */
            user-select: none; 
            -webkit-user-select: none;
            -ms-user-select: none;
        }
        .content-box {
            background-color: rgba(59, 66, 25, 0.95);
            padding: 40px;
            border: 4px solid #000000;
            border-radius: 8px;
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        .banner-image {
            max-width: 100%;
            height: auto;
            border: 4px solid #000000;
            border-radius: 5px;
            margin-bottom: 25px;
        }
        .protection-notice {
            font-size: 0.85rem;
            color: #cddb9f;
            margin-bottom: 25px;
            font-style: italic;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 35px;
        }
        .story-link {
            background-color: #4b5320;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 5px;
            width: 80%;
            border: 2px solid #000000;
            transition: background 0.3s, padding-left 0.3s;
        }
        .story-link:hover {
            background-color: #000000;
            padding-left: 35px;
        }
        
        /* Visitor Counter Styling */
        .jenn-counter-box {
            margin-top: 25px;
            margin-bottom: 15px;
            background-color: rgba(30, 35, 10, 0.85);
            border: 2px solid #000000;
            padding: 12px 20px;
            border-radius: 6px;
            display: inline-block;
        }
        .jenn-counter-title {
            font-size: 0.8rem;
            color: #cddb9f;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .jenn-counter-digits {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #111111;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid #4b5320;
            letter-spacing: 3px;
        }

        .disclaimer {
            font-size: 0.85rem;
            color: #d4d9bc;
            border-top: 2px solid #000000;
            padding-top: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body oncontextmenu="return false;" oncopy="return false;" oncut="return false;" ondragstart="return false;" onselectstart="return false;">

    <div class="content-box">
        <!-- Artsy Collage Banner Image -->
        <img src="77fc7c46-5538-43ff-b000-4f02f9c3639e.webp" alt="Writings By The Jenn Banner" class="banner-image">

        <div class="protection-notice">Protected content - **Some AI Generated Pictures.</div>

        <!-- All Stories -->
        <div class="menu-container">
            <a href="paper-trails.html" class="story-link">Paper Trails</a>
            <a href="the-inferno.html" class="story-link">The Inferno</a>
            <a href="adjourned-affections.html" class="story-link">Adjourned Affections</a>
            <a href="under-her-hands.html" class="story-link">Under Her Hands</a>
            <a href="locus-of-control.html" class="story-link">Locus Of Control</a>
        </div>

        <!-- Visitor Page Counter Widget -->
        <div class="jenn-counter-box">
            <div class="jenn-counter-title">Library Visitors</div>
            <div id="jenn-visitor-count" class="jenn-counter-digits">000482</div>
        </div>

        <!-- Disclaimer -->
        <div class="disclaimer">
            I have no rights to these characters; only the Alternate Universe they live in.
        </div>
    </div>

    <!-- Script to block keyboard shortcuts for copying/inspecting and handle counter -->
    <script>
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'p' || e.key === 'a')) { 
                e.preventDefault(); 
            }
        });

        // Simple unique visitor counter using localStorage
        (function() {
            let visits = localStorage.getItem('jenn_site_visits');
            if (!visits) {
                visits = 482; // Starting baseline number
            } else {
                visits = parseInt(visits);
            }
            
            // Check if this is a new session
            if (!sessionStorage.getItem('jenn_counted_session')) {
                visits++;
                localStorage.setItem('jenn_site_visits', visits);
                sessionStorage.setItem('jenn_counted_session', 'true');
            }

            // Format with leading zeros (e.g. 000483)
            let formattedCount = String(visits).padStart(6, '0');
            document.getElementById('jenn-visitor-count').textContent = formattedCount;
        })();
    </script>
</body>
</html>
