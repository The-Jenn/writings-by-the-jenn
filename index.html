            /* Text protection settings matching chapters */

        .menu-container {

            font-size: 1.2rem;
            border-radius: 5px;
            width: 80%;
            border: 2px solid #000000;
            transition: background 0.3s, padding-left 0.3s;
        }
        .story-link:hover {
            background-color: #000000;
            padding-left: 35px;
        }
        
        /* Real Live Counter Box styling */
        .counter-wrapper {
            margin-top: 25px;
            margin-bottom: 15px;
            background-color: rgba(30, 35, 10, 0.9);
            border: 2px solid #000000;
            padding: 12px 20px;
            border-radius: 6px;
            display: inline-block;
        }
        .counter-label {
            font-size: 0.8rem;
            color: #cddb9f;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .disclaimer {
            font-size: 0.85rem;
            color: #d4d9bc;
            border-top: 2px solid #000000;
            padding-top: 20px;
            margin-top: 20px;
        }

</head>

        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'p' || e.key === 'a')) {
