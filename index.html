<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writings By The Jenn</title>
    <style>
        body {
            background-color: #0b3d0b; /* Deep green background */
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            text-align: center;
            padding: 50px 20px;
            background-color: #062b06; /* Slightly darker green header */
            border-bottom: 3px solid #4caf50;
        }
        .header h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: 2px;
        }
        .header h2 {
            font-size: 1.5rem;
            font-weight: normal;
            margin-top: 10px;
            color: #a3d9a3; /* Lighter green for subtitle */
        }
        .menu-container {
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Aligns links to the left */
            gap: 15px;
        }
        .story-link {
            background-color: #145c14;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 5px;
            width: 300px; /* Keeps all buttons the exact same width */
            border-left: 6px solid #4caf50;
            transition: background 0.3s, padding-left 0.3s;
        }
        .story-link:hover {
            background-color: #1f851f;
            padding-left: 35px; /* Slight indent effect on hover */
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Writings By The Jenn</h1>
        <h2>Fanfiction Stories</h2>
    </div>

    <div class="menu-container">
        <!-- Links to your story pages -->
        <a href="stories.html" class="story-link">1. Paper Trails</a>
        <a href="locus-of-control.html" class="story-link">2. Locus Of Control</a>
        <a href="the-inferno.html" class="story-link">3. The Inferno</a>
        <a href="adjourned-affections.html" class="story-link">4. Adjourned Affections</a>
    </div>

</body>
</html>
