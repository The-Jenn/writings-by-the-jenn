            background-size: cover;

            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .content-box {
            background-color: rgba(59, 66, 25, 0.92); /* Slightly transparent so the background shows through */
            padding: 40px;
            border: 4px solid #000000;
            border-radius: 8px;
            max-width: 850px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 2.5rem;
            margin-top: 0;
            border-bottom: 2px solid #000000;
            padding-bottom: 20px;
            text-align: center;
        }
        .story-image {
            max-width: 100%;
            max-height: 600px;
            width: auto;
            height: auto;
            border: 4px solid #000000;
            border-radius: 5px;
            margin-bottom: 30px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .metadata-box {
            background-color: rgba(30, 35, 10, 0.85);
            padding: 20px;
            border: 2px solid #000000;
            border-radius: 5px;
            margin-bottom: 30px;
            text-align: left;
            font-size: 0.98rem;
            line-height: 1.6;
        }
        .toc-container {
            background-color: rgba(30, 35, 10, 0.9);
            padding: 25px 20px;
            border: 3px solid #000000;
            border-radius: 8px;
            margin-bottom: 50px;
        }
        .toc-title {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 18px;
            color: #cddb9f;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
        }
        .chapter-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            max-height: 380px;
            overflow-y: auto;
            padding: 10px 5px;
        }
        .chapter-grid::-webkit-scrollbar {
            width: 10px;
        }
        .chapter-grid::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 5px;
        }
        .chapter-grid::-webkit-scrollbar-thumb {
            background: #cddb9f;
            border-radius: 5px;
            border: 2px solid #000000;
        }
        .chapter-link {
            background-color: #4b5320;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border: 2px solid #000000;
            border-radius: 5px;
            width: 85%;
            transition: background 0.3s;
            box-sizing: border-box;
            text-align: center;
        }
        .chapter-link:hover {
            background-color: #000000;
            color: #cddb9f;
        }
        .chapter-section {
            margin-top: 50px;
            border-top: 3px solid #000000;
            padding-top: 35px;
            text-align: left;
        }
        .chapter-title {
            font-size: 1.75rem;
            margin-bottom: 25px;
            color: #cddb9f;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #000000;
            padding-bottom: 12px;
        }
        p {
            line-height: 1.75;
            margin-bottom: 20px;
            font-size: 1.05rem;
        }
        .back-to-top {
            display: inline-block;
            margin-top: 15px;
            background-color: #262b10;
            color: #cddb9f;
            text-decoration: none;
            padding: 8px 18px;
            font-size: 0.95rem;
            border: 1px solid #000000;
            border-radius: 4px;
        }
        .back-to-top:hover {
            background-color: #000000;
            color: #ffffff;
        }
        .home-btn {
            display: inline-block;
            margin-top: 35px;
            background-color: #000000;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 5px;
        }
        .home-btn:hover {
            background-color: #222222;
        }

            background-color: #cddb9f;

            border-radius: 5px;
            border: 2px solid #000000;
            color: #000000;
